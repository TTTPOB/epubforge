[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epubforge"
version = "0.1.0"
description = "LLM-assisted PDF to EPUB converter for books and theses"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX",
]
dependencies = [
    "docling>=2.0",
    "openai>=1.54",
    "ebooklib>=0.18",
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "paddlepaddle==3.2.2",
    "paddleocr[doc-parser]==3.3.2",
    "filelock>=3.29",
]

[project.optional-dependencies]
ocr = ["onnxruntime>=1.16"]

[project.scripts]
epubforge = "epubforge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8",
    "pytest-timeout>=2.4",
    "pyrefly>=0.16",
    "pre-commit>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epubforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "2", "--dist", "worksteal"]
