[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epubforge"
version = "0.1.0"
description = "MinerU and OpenCode pipeline for corrected chapter HTML"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "paddlepaddle==3.2.2",
    "paddleocr==3.3.2",
    "filelock>=3.29",
]

[project.scripts]
epubforge = "epubforge.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8",
    "pytest-timeout>=2.4",
    "pyrefly>=0.16",
    "pre-commit>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/epubforge"]
artifacts = ["src/epubforge/agents/*.md"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.beads",
    "/.claude",
    "/.codegraph",
    "/.opencode",
    "/.pytest_cache",
    "/config.local.toml",
    "/work",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-n", "2", "--dist", "worksteal"]
