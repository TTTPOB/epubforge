# Example configuration for epubforge.
# Pass this file via: uv run epubforge --config config.example.toml <command>
# Settings here can be overridden by documented EPUBFORGE_* environment variables.
# Unknown keys in known sections are rejected (fail-fast).

# OpenCode owns book-editor model authentication and provider settings.
# epubforge does not accept model API keys or endpoint configuration.

[mineru]
api_key               = ""  # required for MinerU API calls; or set EPUBFORGE_MINERU_API_KEY
base_url              = "https://mineru.net/api/v4"
model_version         = "vlm"  # pipeline | vlm
timeout_seconds       = 300
poll_interval_seconds = 2
max_polls             = 300
max_download_bytes    = 2147483648  # 2 GiB compressed ZIP limit
max_uncompressed_bytes = 8589934592 # 8 GiB extracted ZIP limit
is_ocr                = false
enable_formula        = true
enable_table          = true
language              = "ch"  # ch | en | korean | japan

[runtime]
concurrency = 4
work_dir    = "work"
log_level   = "INFO"   # DEBUG | INFO | WARNING

[chapters]
render_dpi   = 150  # chapter page JPEG rendering DPI; valid range 72-300
jpeg_quality = 92   # chapter page JPEG quality; valid range 1-100
