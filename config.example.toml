# Example configuration for epubforge.
# Pass this file via: uv run epubforge --config config.example.toml <command>
# Settings here can be overridden by EPUBFORGE_* environment variables.
# Unknown keys in any section are rejected (fail-fast).

[llm]
base_url        = "https://openrouter.ai/api/v1"
api_key         = ""  # required; or set EPUBFORGE_LLM_API_KEY
model           = "openai/gpt-5.6-luna"  # Luna Medium; provider model ID
timeout_seconds = 120
# Wrap the system prompt with cache_control: ephemeral for Anthropic prompt caching.
# Enabled by default. Safe on OpenRouter (ignored by Gemini & OpenAI which use implicit caching).
# prompt_caching = true
# Provider-specific reasoning settings belong in extra_body.

[mineru]
api_key               = ""  # required for MinerU API calls; or set EPUBFORGE_MINERU_API_KEY
base_url              = "https://mineru.net/api/v4"
model_version         = "vlm"  # pipeline | vlm
timeout_seconds       = 300
poll_interval_seconds = 2
max_polls             = 300
max_download_bytes    = 2147483648  # 2 GiB compressed ZIP limit
max_uncompressed_bytes = 8589934592 # 8 GiB extracted ZIP limit
is_ocr                = false
enable_formula        = true
enable_table          = true
language              = "ch"  # ch | en | korean | japan

[runtime]
concurrency = 4
cache_dir   = "work/.cache"
work_dir    = "work"
out_dir     = "out"
log_level   = "INFO"   # DEBUG | INFO | WARNING

[editor]
compact_threshold           = 50     # compact after N audit events
max_loops                   = 50     # max agent loop iterations

[extract]
enable_book_memory   = true  # maintain rolling BookMemory across extraction units

[chapters]
render_dpi   = 150  # chapter page JPEG rendering DPI; valid range 72-300
jpeg_quality = 92   # chapter page JPEG quality; valid range 1-100
